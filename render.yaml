# Render Blueprint: a free static site built from this repo.
# In Render: New > Blueprint, pick this repository, and it sets everything up.
services:
  - type: web
    name: weclip
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: out
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NEXT_PUBLIC_RELEASES_REPO
        value: Sandip123samanta/weclip-releases
      - key: NEXT_PUBLIC_SITE_URL
        value: https://weclip.onrender.com
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /download
        destination: /download/index.html
